<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2C2C2C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF9A56;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#DE5B3C;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FFB366;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#FF8A50;stop-opacity:0.05" />
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="256" height="256" rx="56" fill="url(#bg)" />

    <!-- Main icon: Simple image with magnifying glass -->
    <g transform="translate(128, 95)">
        <!-- Image frame -->
        <rect x="-50" y="-50" width="100" height="100" rx="8"
            fill="#0A0A0A" stroke="url(#orange)" stroke-width="4" />

        <!-- Simplified pixel grid (3x3) -->
        <g opacity="0.7">
            <rect x="-38" y="-38" width="22" height="22" rx="2" fill="#FF6B6B" />
            <rect x="-10" y="-38" width="22" height="22" rx="2" fill="#4ECDC4" />
            <rect x="18" y="-38" width="22" height="22" rx="2" fill="#FFB366" />

            <rect x="-38" y="-10" width="22" height="22" rx="2" fill="#A29BFE" />
            <rect x="-10" y="-10" width="22" height="22" rx="2" fill="#FD79A8" />
            <rect x="18" y="-10" width="22" height="22" rx="2" fill="#55EFC4" />

            <rect x="-38" y="18" width="22" height="22" rx="2" fill="#FDCB6E" />
            <rect x="-10" y="18" width="22" height="22" rx="2" fill="#74B9FF" />
            <rect x="18" y="18" width="22" height="22" rx="2" fill="#DFE6E9" />
        </g>

        <!-- Magnifying glass - clean and prominent -->
        <g transform="translate(60, -60)">
            <circle r="28" fill="rgba(255, 154, 86, 0.1)" stroke="url(#orange)"
                stroke-width="4" filter="url(#glow)" />
            <line x1="20" y1="20" x2="38" y2="38" stroke="url(#orange)"
                stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

            <!-- Zoomed pixels visible in lens -->
            <rect x="-8" y="-8" width="6" height="6" rx="1" fill="#FF6B6B" opacity="0.6" />
            <rect x="-1" y="-8" width="6" height="6" rx="1" fill="#4ECDC4" opacity="0.6" />
            <rect x="-8" y="-1" width="6" height="6" rx="1" fill="#A29BFE" opacity="0.6" />
            <rect x="-1" y="-1" width="6" height="6" rx="1" fill="#FD79A8" opacity="0.6" />
        </g>
    </g>

    <!-- Text section -->
    <g transform="translate(128, 185)">
        <!-- Stegsolve -->
        <text y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="32"
            font-weight="600" fill="url(#orange)" text-anchor="middle"
            letter-spacing="1">STEGSOLVE</text>

        <!-- Rust badge -->
        <g transform="translate(0, 28)">
            <rect x="-38" y="-12" width="76" height="24" rx="12"
                fill="#DE5B3C" opacity="0.2" />
            <text y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="16"
                font-weight="600" fill="#FF9A56" text-anchor="middle"
                letter-spacing="2.5">RUST</text>
        </g>
    </g>

    <!-- Subtle binary decoration -->
    <g opacity="0.15" font-family="monospace" font-size="10" fill="#FF8A50">
        <text x="20" y="30">01101100</text>
        <text x="180" y="240">01110011</text>
    </g>
</svg>